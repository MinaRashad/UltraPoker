<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deck Shuffle Card Test</title>
  <style>
    body {
      max-width: 1000px;
      margin: 32px auto;
      padding: 0 20px;
      color: #f3f4f6;
      background: #111827;
      font: 16px system-ui, sans-serif;
    }

    button {
      min-height: 42px;
      margin: 0 8px 12px 0;
      padding: 8px 14px;
      border: 1px solid #4b5563;
      border-radius: 6px;
      color: white;
      background: #2563eb;
      font: inherit;
      cursor: pointer;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { color: #9ca3af; }
    #cardCanvasContainer {
      overflow-x: auto;
      padding: 12px;
      border-radius: 8px;
      background: #374151;
    }

    #cardCanvasContainer canvas {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    #steps {
      max-height: 220px;
      overflow-y: auto;
      padding: 16px 16px 16px 40px;
      border-radius: 8px;
      background: #1f2937;
    }
  </style>
</head>
<body>
  <h1>Local Deck Shuffle Test</h1>
  <p>Apply shuffle and encryption layers, then remove one encryption layer from every card per click. The cards stay in their current shuffled order.</p>
  <button id="encryptButton" type="button">Shuffle and encrypt another layer</button>
  <button id="decryptButton" type="button" disabled>Decrypt one layer</button>
  <p id="status" role="status" aria-live="polite"></p>

  <h2>Ten-card sample</h2>
  <div id="cardCanvasContainer"></div>

  <h2>Encryption and decryption steps</h2>
  <ol id="steps"></ol>

  <script src="Engine.js"></script>
  <script src="cardgenerator.js"></script>
  <script>
    const deckTestEngine = new P2PEngine();
    const deckTestInitialCards = [0, 9, 10, 11, 12, 13, 22, 26, 39, 51];
    const deckTestSize = deckTestInitialCards.length;
    const deckTestColumns = 4;
    let deckTestDeck = [...deckTestInitialCards];

    document.getElementById("cardCanvasContainer").appendChild(canvas);
    canvas.width = deckTestColumns * (cardWidth + 10) + 10;
    canvas.height = Math.ceil(deckTestSize / deckTestColumns) * (cardHeight + 10) + 10;

    function renderSample() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      deckTestDeck.forEach((cardId, index) => {
        const x = 10 + (index % deckTestColumns) * (cardWidth + 10);
        const y = 10 + Math.floor(index / deckTestColumns) * (cardHeight + 10);
        if (deckTestEngine.encryptionLayers.length > 0) {
          drawCardBack(x, y);
          return;
        }

        const card = deckTestEngine.cardDefinitions[cardId];
        const suitSymbol = card.slice(-1);
        const suit = {
          "♣": "club",
          "♦": "diamond",
          "♥": "heart",
          "♠": "spade",
        }[suitSymbol];
        const color = suitSymbol === "♥" || suitSymbol === "♦" ? "red" : "black";
        const rank = card.slice(0, -1) === "A" ? "1" : card.slice(0, -1);
        drawCard(x, y, rank, suit, color);
      });

      const layerCount = deckTestEngine.encryptionLayers.length;
      document.getElementById("status").textContent =
        layerCount > 0
          ? `${layerCount} encryption layer(s) remain. Cards are face-down.`
          : "All encryption layers are removed. Cards are shown in the final shuffled order.";
      document.getElementById("decryptButton").disabled = layerCount === 0;
    }

    function recordStep(action) {
      const step = document.createElement("li");
      step.textContent =
        `${action} — ${deckTestEngine.encryptionLayers.length} layer(s); first 10 values: ` +
        deckTestDeck.slice(0, deckTestSize).join(", ");
      document.getElementById("steps").prepend(step);
    }

    document.getElementById("encryptButton").addEventListener("click", () => {
      try {
        deckTestDeck = deckTestEngine.applyDeckLayer(deckTestDeck);
        renderSample();
        recordStep("Shuffled and encrypted");
      } catch (error) {
        document.getElementById("status").textContent =
          `Encryption failed: ${error.message || error}`;
      }
    });

    document.getElementById("decryptButton").addEventListener("click", () => {
      try {
        const layer = deckTestEngine.encryptionLayers.pop();
        if (!layer) {
          throw new Error("There are no encryption layers to remove.");
        }
        deckTestDeck = deckTestDeck.map((card) => (card ^ layer.key) >>> 0);
        renderSample();
        recordStep("Decrypted one layer from every card; deck order is unchanged");
      } catch (error) {
        document.getElementById("status").textContent =
          `Layer decryption failed: ${error.message || error}`;
      }
    });

    renderSample();
  </script>
</body>
</html>
