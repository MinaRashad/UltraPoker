<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Playground</title>
</head>
<body>
    <label>Your ID is: <span id="yourId">Connecting...</span></label>
    <button onclick="copyId()">Copy Id</button>
    <input type="text" placeholder="Enter peer ID" id="idInput">
    <button onclick="connectToPeer()">Connect</button>

    <div id="chatContainer">
        <h3>Chat</h3>
        <div id="messages"></div>
        <input type="text" id="messageInput" placeholder="Type a message">
        <button onclick="sendMessage()">Send</button>
    </div>

    <div id="connectedPeersContainer">
        <h3>Connected Peers</h3>
        <table id="connectedPeersTable">
            <thead>
                <tr>
                    <th>Peer ID</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="connectedPeersBody">
                <!-- Connected peers will be listed here -->
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.3.2/dist/peerjs.min.js"></script>
    <script src="connectionManager.js"></script>
    <script>
        const connectionManager = new PeerConnectionManager();
        
        // Display your ID once connected
        connectionManager.getPeerId().then(id => {
            document.getElementById('yourId').textContent = id;
        }).catch(err => {
            console.error('Error getting peer ID:', err);
        });
        
        // always put all the logs in the messages div
        setInterval(() => {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '';
            connectionManager.log.forEach(log => {
                const logElement = document.createElement('div');
                logElement.textContent = log;
                messagesDiv.appendChild(logElement);
            });

            // Update connected peers table 
            const connectedPeersBody = document.getElementById('connectedPeersBody');
            connectedPeersBody.innerHTML = '';
            // use lastSeen = {}
            // this contains IDs and timestamps of last seen messages from peers
            // if it was last seen more than 10 seconds ago, mark it as disconnected
            const now = Date.now();
            for (const peer_id of connectionManager.peer_ids) {
                const lastSeen = connectionManager.lastSeen[peer_id];
                const status = (lastSeen && (now - lastSeen < 10000)) ? 'Connected' : 'Disconnected';
                const row = document.createElement('tr');
                const idCell = document.createElement('td');
                idCell.textContent = peer_id;
                const statusCell = document.createElement('td');
                statusCell.textContent = status;
                row.appendChild(idCell);
                row.appendChild(statusCell);
                connectedPeersBody.appendChild(row);
            }


        }, 1000);

        function connectToPeer() {
            const peerId = document.getElementById('idInput').value;
            connectionManager.connectToPeer(peerId);
        }

        function sendMessage() {
            const message = document.getElementById('messageInput').value;
            const peerId = document.getElementById('idInput').value;
            connectionManager.sendToAll(message);
        }

        function copyId() {
            const yourId = document.getElementById('yourId').textContent;
            navigator.clipboard.writeText(yourId).catch(err => {
                console.error('Failed to copy ID: ', err);
            });
        }
    </script>
</body>
</html>
